
name: Notificar novas notícias

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - noticias.json

permissions:
  contents: read

jobs:
  enviar-notificacoes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Testar notificação para todos
        if: github.event_name == 'workflow_dispatch'
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_APP_ID: c0e9507b-bb6b-410f-84c3-4b2d24dc207e
        run: |
          node <<'NODE'
          async function main() {
            const resposta = await fetch(
              "https://api.onesignal.com/notifications",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Key ${process.env.ONESIGNAL_REST_API_KEY}`
                },
                body: JSON.stringify({
                  app_id: process.env.ONESIGNAL_APP_ID,
                  included_segments: ["Total Subscriptions"],
                  headings: {
                    "en": "DashWatch Test",
                    "pt-BR": "Teste do DashWatch"
                  },
                  contents: {
                    "en": "If you received this, the notification is working!",
                    "pt-BR": "Se você recebeu isto, a notificação está funcionando!"
                  },
                  url: "https://dashwatch.news/"
                })
              }
            );

            const resultado = await resposta.text();
            console.log(`HTTP: ${resposta.status}`);
            console.log(`Resposta: ${resultado}`);

            if (!resposta.ok) process.exitCode = 1;
          }

          main().catch(erro => {
            console.error(erro);
            process.exitCode = 1;
          });
          NODE

      - name: Detectar notícias novas e notificar
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_APP_ID: c0e9507b-bb6b-410f-84c3-4b2d24dc207e
        run: |
          set -e

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Primeiro commit: nenhuma notificação enviada."
            exit 0
          fi

          if ! git show "$BEFORE:noticias.json" > /tmp/anterior.json 2>/dev/null; then
            echo "ERRO: não consegui ler o arquivo anterior. Abortando para evitar spam."
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");

          const anterior = JSON.parse(
            fs.readFileSync("/tmp/anterior.json", "utf8")
          );
          const atual = JSON.parse(
            fs.readFileSync("noticias.json", "utf8")
          );

          const urlsAntigas = new Set(
            anterior.map(n => n.url).filter(Boolean)
          );

          const novas = atual.filter(
            n => n.url && !urlsAntigas.has(n.url)
          );

          async function enviar() {
            if (novas.length === 0) {
              console.log("Nenhuma notícia nova. Nenhuma notificação enviada.");
              return;
            }

            const titulo = novas.length === 1
              ? novas[0].titulo
              : "📰 Novas notícias no DashWatch!";

            const descricao = novas.length === 1
              ? (novas[0].descricao ||
                 "Confira a nova notícia no DashWatch.")
              : `${novas.length} novas notícias publicadas. Confira as últimas no DashWatch!`;

            const resposta = await fetch(
              "https://api.onesignal.com/notifications",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization":
                    `Key ${process.env.ONESIGNAL_REST_API_KEY}`
                },
                body: JSON.stringify({
                  app_id: process.env.ONESIGNAL_APP_ID,
                  target_channel: "push",
                  included_segments: ["Total Subscriptions"],
                  headings: {
                    "en": titulo,
                    "pt-BR": titulo
                  },
                  contents: {
                    "en": descricao,
                    "pt-BR": descricao
                  },
                  url: novas.length === 1
                    ? new URL(
                        novas[0].url,
                        "https://dashwatch.news/"
                      ).href
                    : "https://dashwatch.news/"
                })
              }
            );

            const resultado = await resposta.text();

            if (!resposta.ok) {
              throw new Error(
                `Erro do OneSignal (${resposta.status}): ${resultado}`
              );
            }

            console.log(`OneSignal HTTP: ${resposta.status}`);
            console.log(`Resposta do OneSignal: ${resultado}`);
            console.log(`Solicitação processada. Notícias novas: ${novas.length}`);
          }

          enviar().catch(erro => {
            console.error(erro);
            process.exitCode = 1;
          });
          NODE
